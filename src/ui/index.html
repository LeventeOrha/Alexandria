<!DOCTYPE html>
<head>
  <link rel="stylesheet" href="styles/root.css">
  <link rel="stylesheet" href="styles/nav.css">
  <link rel="stylesheet" href="styles/bookList.css">
  <link rel="stylesheet" href="styles/bookData.css">
  <link rel="stylesheet" href="styles/searchOnline.css">
  <link rel="stylesheet" href="styles/aiChat.css">
  <link rel="stylesheet" href="styles/settings.css">
  <link rel="stylesheet" href="styles/homePage.css">
  <link rel="stylesheet" href="styles/messages.css">
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet">
</head>
<body>
    <div class="message-holder hidden" id="message-holder">
        <div id="message" class="glass"></div>
    </div>

    <div class="nav-holder">
        <nav class="glass">
            <div class="glass indicator"></div>
            <button class="navButton active" id="homeButton">🏠</button>
            <button class="navButton" id="searchOnlineButton">🌍</button>
            <button class="navButton" id="searchButton">🔍</button>
            <button class="navButton" id="aiButton">🤖</button>
            <button class="navButton" id="settingsButton">⚙️</button>
        </nav>
    </div>

    <div class="main" id="homePage">
        <div class="glass shelf" id="toReadShelf">
            <div class="header">
                <select class="glass">
                    <option value="To read">To read</option>
                </select>
                <button id="refreshToRead">🔄️</button>
                <button id="editToRead">✏️</button>
            </div>
            <div class="shelfBody"></div>
        </div>
        <div id="currentReading" class="glass">
            <div id="currentHeader">
                <select id="currentList" class="glass">
                </select>
            </div>
            <div id="currentBody" class="carousel">
            </div>
        </div>
        <div class="glass shelf" id="ownedShelf">
            <div class="header">
                <select class="glass">
                    <option value="Owned">Owned</option>
                </select>
                <button id="refreshOwned">🔄️</button>
                <button id="editOwned">✏️</button>
            </div>
            <div class="shelfBody"></div>
        </div>
        <div id="calendar" class="glass"></div>
    </div>

    <div class="main lower" id="searchOnline">
        <div class="onlineHolder glass">
            <div id="onlineSearchBar">
                <div class="center">
                    <input type="text" id="onlineTitle" class="glass" placeholder="Title">
                    <input type="text" id="onlineAuthor" class="glass" placeholder="Author">
                    <select id="language" class="glass">
                        <option value="en">En</option>
                        <option value="hu">Hu</option>
                    </select>
                    <button id="startOnlineSearch" class="glass">🔍</button>
                </div>
                <div class="right">
                    <select id="saveShelf" class="glass">
                    </select>
                    <button id="saveBooksOnShelf" class="glass">Save</button>
                </div>
            </div>
            <div id="onlineResults">

            </div>
        </div>
    </div>

    <div class="main lower" id="searchInLibrary">
        <div class="list glass">
            <div class="searchBar">
                <select id="searchKey" class="glass">
                    <option value="title" id="searchKeyTitle">Title</option>
                    <option value="author" id="searchKeyAuthor">Author</option>
                    <option value="shelf" id="searchKeyShelf">Shelf</option>
                    <option value="category" id="searchKeyCategory">Category</option>
                </select>
                <input type="text" id="searchValue" class="glass">
                <input type="submit" value="🔍" id="startSearch" class="glass">
            </div>
            <div class="searchResults">
            </div>
        </div>
    
        <div class="bookData glass"></div>
    </div>

    <div class="main lower" id="talkWithLibrarian">
        <div id="aiChat" class="glass">
            <div id="aiHeader" class="">
                <input type="text" value="Librarian" id="aiName" class="glass">
            </div>
            <div id="aiBody">
            </div>
            <div id="aiNewMessage" class="">
                <textarea class="glass" id="writeNewMessage"></textarea>
                <button id="sendNewMessage" class="glass">📤</button>
            </div>
        </div>
    </div>

    <div class="main lower" id="settingsMain">
        <table class="glass" id="settingsPanel">
            <tr>
                <td>Google Books API key:</td>
                <td>
                    <input class="glass" id="googleBooksKey" type="text">
                </td>
            </tr>
            <tr>
                <td>Gemini API key:</td>
                <td>
                    <input class="glass" id="geminiKey" type="text">
                </td>
            </tr>
            <tr>
                <td id="languageSetting">Language: </td>
                <td>
                    <select class="glass" id="selectLanguage">
                    </select>
                </td>
            </tr>
            <tr>
                <td>Gemini model:</td>
                <td>
                    <select class="glass" id="selectAI">
                    </select>
                </td>
            </tr>
            <tr>
                <td id="aiChatColorSetting">Librarian chat color:</td>
                <td>
                    <input class="glass" id="aiChatColor" type="color">
                </td>
            </tr>
            <tr>
                <td id="userChatColorSetting">User chat color:</td>
                <td>
                    <input class="glass" id="userChatColor" type="color">
                </td>
            </tr>
            <tr>
                <td id="backgroundImageSetting">Background image:</td>
                <td>
                    <button class="glass" id="backgroundImage"></button>
                </td>
            </tr>
            <tr>
                <td id="GUISetting">Graphical interface:</td>
                <td>
                    <label class="switch">
                        <input type="checkbox" checked id="guiUsage">
                        <span class="slider round"></span>
                    </label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <button id="saveSettings" class="glass">Save</button>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="exportLibrary" class="glass">Export library</button>
                </td>
                <td>
                    <button id="importLibrary" class="glass">Import library</button>
                </td>
            </tr>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.19/locales-all.global.min.js"></script>
    <script src="scripts/python.js"></script>
    <script src="scripts/bootstrap.js"></script>
</body>
